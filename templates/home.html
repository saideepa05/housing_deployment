<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ML API</title>
    <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Arimo' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Hind:300' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>
    <div class="login">
        <h1>California Housing Price Prediction</h1>

        <!-- Main Input For Receiving Query to our ML -->
        <form action="{{ url_for('predict')}}" method="post">
            <input type="text" name="MedInc" placeholder="Median Income (MedInc)" required="required" />
            <input type="text" name="HouseAge" placeholder="House Age" required="required" />
            <input type="text" name="AveRooms" placeholder="Average Rooms (AveRooms)" required="required" />
            <input type="text" name="AveBedrms" placeholder="Average Bedrooms (AveBedrms)" required="required" />
            <input type="text" name="Population" placeholder="Population" required="required" />
            <input type="text" name="AveOccup" placeholder="Average Occupancy (AveOccup)" required="required" />
            <input type="text" name="Latitude" placeholder="Latitude" required="required" />
            <input type="text" name="Longitude" placeholder="Longitude" required="required" />

            <button type="submit" class="btn btn-primary btn-block btn-large">Predict</button>
        </form>

        <br>
        <br>

        {{prediction_text}}

    </div>


</body>

</html>
